<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Nexus Web Tools</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:system-ui,sans-serif; background:#f7f8fb; color:#1f2430; }
  .card { text-align:center; padding:2rem; max-width:420px; }
  .icon { font-size:3rem; margin-bottom:1rem; }
  h1 { font-size:1.3rem; margin:.5rem 0; }
  p { color:#5a6270; line-height:1.5; }
  button { margin-top:1rem; padding:.6rem 1.4rem; border:none; border-radius:8px; background:#3b5bdb; color:#fff; font-size:1rem; cursor:pointer; }
  button:hover { background:#3450c4; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🧰</div>
    <h1>You're offline</h1>
    <p>Nexus Web Tools needs an internet connection for this page. Calculators you've visited recently may still work — try going back.</p>
    <button onclick="location.href='/'">Back to Home</button>
  </div>
</body>
</html>
